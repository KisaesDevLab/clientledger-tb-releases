name: Feature request
description: Suggest something ClientLedger Trial Balance should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach or paste client data, tax documents, company files, backups (.tbak), licence keys, or screenshots showing them. Issues are public.**
        Use made-up names and numbers. For anything that needs client data, email support@kisaes.com instead.
  - type: input
    id: version
    attributes:
      label: App version
      description: Help > About.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Settings > System > About.
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: The task you are doing and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (how you do it today)
      description: Step by step, with made-up data.
  - type: checkboxes
    id: no-client-data
    attributes:
      label: Client data
      options:
        - label: This request contains no client data, tax documents, company files, backups or screenshots showing them.
          required: true
